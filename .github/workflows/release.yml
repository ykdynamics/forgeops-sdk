name: release

# Pushing a tag vX.Y.Z[-pre] (made with `make release-tag`) builds forgeops-cap
# for the supported platforms with the pinned toolchain and drafts a GitHub
# release with the tarballs and SHA256SUMS. Nothing is published until the
# owner publishes the draft. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: make check
      - run: make release-build VERSION="$GITHUB_REF_NAME"
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --draft $pre --verify-tag \
            --title "forgeops-sdk $GITHUB_REF_NAME" \
            --notes "forgeops-cap for Linux amd64 and arm64, built with $(sed -n 's/^toolchain //p' go.mod) (reproducible: -trimpath, -buildvcs=false, CGO off). Verify with SHA256SUMS. Go module: go get github.com/ykdynamics/forgeops-sdk@$GITHUB_REF_NAME"
